openapi: 3.0.3
info:
  title: Grand Total Service
  description: Microservice for calculating the grand total monetary amount payable for an order or shopping cart.
  version: 1.0.0
paths:
  /api/v1/cart/calculate-grand-total:
    post:
      tags:
        - Generated Service
      summary: Calculate Grand Total
      description: Invoked when calculating or displaying the total monetary amount payable for the shopping cart or order.
      operationId: getGrandTotal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrandTotalCalculationRequest'
      responses:
        '200':
          description: Grand total calculation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrandTotalBreakdown'
        '422':
          description: Validation Error
components:
  schemas:
    CartItemSchema:
      type: object
      required:
        - item_name
        - unit_price
      properties:
        id:
          type: string
          nullable: true
        item_name:
          type: string
        quantity:
          type: integer
          default: 1
          minimum: 1
        unit_price:
          type: number
          format: double
          minimum: 0.0
        subtotal:
          type: number
          format: double
          nullable: true
    ShipGroupSchema:
      type: object
      properties:
        id:
          type: string
          nullable: true
        shipping_estimate:
          type: number
          format: double
          default: 0.0
        tax_adjustment:
          type: number
          format: double
          default: 0.0
    OrderAdjustmentSchema:
      type: object
      required:
        - adjustment_type
      properties:
        id:
          type: string
          nullable: true
        ship_group_id:
          type: string
          nullable: true
        adjustment_type:
          type: string
          description: 'Type: OTHER or GLOBAL'
        amount:
          type: number
          format: double
          default: 0.0
    GrandTotalCalculationRequest:
      type: object
      required:
        - items
        - ship_groups
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemSchema'
        ship_groups:
          type: array
          items:
            $ref: '#/components/schemas/ShipGroupSchema'
        order_adjustments:
          type: array
          items:
            $ref: '#/components/schemas/OrderAdjustmentSchema'
          default: []
        global_adjustments:
          type: array
          items:
            type: number
            format: double
          default: []
    GrandTotalBreakdown:
      type: object
      required:
        - subtotal
        - total_shipping
        - total_sales_tax
        - other_order_adjustments
        - global_adjustments
        - grand_total
      properties:
        subtotal:
          type: number
          format: double
        total_shipping:
          type: number
          format: double
        total_sales_tax:
          type: number
          format: double
        other_order_adjustments:
          type: number
          format: double
        global_adjustments:
          type: number
          format: double
        grand_total:
          type: number
          format: double
